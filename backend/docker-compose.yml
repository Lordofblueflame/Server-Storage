services:
  muninn:
    build:
      context: .
      dockerfile: Muninn/Dockerfile
    command:
      - /app/Muninn/build/dev-release/muninn_cli
      - --serve
      - --db
      - /data/hostindex
      - --listen-address
      - 0.0.0.0
      - --listen-port
      - "9460"
      - --ws-path
      - /muninn
      - --default-root
      - /data/watched
      - --watch-interval-seconds
      - "2"
      - --io-threads
      - "2"
    environment:
      MUNINN_ALLOWED_CLIENT_INSTANCE_ID: ${MUNINN_ALLOWED_CLIENT_INSTANCE_ID:-hugin-gateway-*}
      MUNINN_BRIDGE_AUTH_TOKEN: ${MUNINN_BRIDGE_AUTH_TOKEN:?Set MUNINN_BRIDGE_AUTH_TOKEN in .env}
    volumes:
      - watched_data:/data/watched
      - muninn_data:/data/hostindex
    networks:
      - backend_net

  hugin:
    build:
      context: .
      dockerfile: Hugin/Dockerfile
    depends_on:
      - muninn
    command:
      - /bin/sh
      - -c
      - >
        exec /app/Hugin/build/dev-release/hugin
        --host-id "docker-host-$$(hostname)-$$(date +%s%N)"
        --client-instance-id "${MUNINN_ALLOWED_CLIENT_INSTANCE_ID:-hugin-gateway-1}"
        --muninn-host muninn
        --muninn-port 9460
        --muninn-path /muninn
        --api-address 0.0.0.0
        --api-port 9440
        --poll-ms 200
    environment:
      HUGIN_JWT_SECRET: ${HUGIN_JWT_SECRET:?Set HUGIN_JWT_SECRET in .env}
      HUGIN_JWT_ISSUER: ${HUGIN_JWT_ISSUER:-}
      HUGIN_JWT_AUDIENCE: ${HUGIN_JWT_AUDIENCE:-}
      HUGIN_LOCAL_ACCESS_TOKEN: ${HUGIN_LOCAL_ACCESS_TOKEN:?Set HUGIN_LOCAL_ACCESS_TOKEN in .env}
      HUGIN_MAX_HTTP_REQUEST_BODY_BYTES: ${HUGIN_MAX_HTTP_REQUEST_BODY_BYTES:-8388608}
      HUGIN_ALLOWED_READ_ROOT: /data/watched
      HUGIN_ALLOWED_WRITE_ROOT: /data/watched
      MUNINN_BRIDGE_AUTH_TOKEN: ${MUNINN_BRIDGE_AUTH_TOKEN:?Set MUNINN_BRIDGE_AUTH_TOKEN in .env}
    ports:
      - "9440:9440"
    volumes:
      - watched_data:/data/watched
    networks:
      - backend_net

  frontend:
    build:
      context: ../frontend/Server-Storage-Angular
      dockerfile: Dockerfile
    depends_on:
      - hugin
    ports:
      - "8080:80"
    networks:
      - backend_net

  smoke-tests:
    image: python:3.12-alpine
    profiles:
      - test
    depends_on:
      - hugin
    command:
      - python
      - /tests/smoke_test.py
    environment:
      HUGIN_BASE_URL: http://hugin:9440
      HUGIN_JWT_SECRET: ${HUGIN_JWT_SECRET:?Set HUGIN_JWT_SECRET in .env}
      HUGIN_JWT_ISSUER: ${HUGIN_JWT_ISSUER:-}
      HUGIN_JWT_AUDIENCE: ${HUGIN_JWT_AUDIENCE:-}
      HUGIN_LOCAL_ACCESS_TOKEN: ${HUGIN_LOCAL_ACCESS_TOKEN:?Set HUGIN_LOCAL_ACCESS_TOKEN in .env}
    volumes:
      - ./tests:/tests:ro
    networks:
      - backend_net

volumes:
  watched_data:
  muninn_data:

networks:
  backend_net:
    driver: bridge
